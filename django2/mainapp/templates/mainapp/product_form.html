{% extends 'base.html' %}

{% block title %}Добавить товар{% endblock %}

{% block content %}
<h1>Добавить товар</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Сохранить</button>
  <a href="{% url 'product_list' %}">Отмена</a>
</form>
{% endblock %}
