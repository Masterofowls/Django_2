{% extends 'base.html' %}
{% block title %}
Главная
{% endblock %}
{% block content %}
  <h1>Главная страница</h1>
  <p>FBV работает.</p>
  
  <a href="{% url 'product_list' %}"
    style="display:inline-block;padding:8px 14px;border:1px solid #333;text-decoration:none;border-radius:6px;">
    Перейти к товарам
  </a>

  {% if user.is_authenticated %}
  <span>{{ user.username }}</span>
  <a href="{% url 'logout' %}"
    style="display:inline-block;padding:8px 14px;border:1px solid #333;text-decoration:none;border-radius:6px;">
    Выйти
  </a>
  {% else %}
  <a href="{% url 'login' %}"
    style="display:inline-block;padding:8px 14px;border:1px solid #333;text-decoration:none;border-radius:6px;">
    Войти
  </a>
  {% endif %}
{% endblock %}
