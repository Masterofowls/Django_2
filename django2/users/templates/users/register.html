{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h1>Регистрация</h1>

{% if form.errors %}
<p style="color:red;">Исправьте ошибки ниже.</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Зарегистрироваться</button>
  <a href="{% url 'login' %}" style="margin-left:10px;text-decoration:none;">
    Уже есть аккаунт? Войти
  </a>
</form>
{% endblock %}
